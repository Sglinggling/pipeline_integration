name: GitHub Actions Demo
on:
  workflow_dispatch:
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Le secret vaut ${{ secrets.SECRET_API_TOKEN }}"
      - run: python3 job.py
        env:
          SECRET_API_TOKEN: ${{ secrets.SECRET_API_TOKEN }}
      - run: echo "Hello depuis la pipeline $(date)" > output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mon-fichier
          path: output.txt
